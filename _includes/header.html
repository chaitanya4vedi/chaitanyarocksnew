<!--Navigation Bar-->
<nav class="navbar fixed-top">
	<div class="container">
		<a class="navbar-brand" href="{{ " /index" | prepend: site.baseurl }}"><img
				src="/assets/images/MaverickGroupLogoGreen.png" alt="Logo" style="width: 25px;"> Maverick Group </a>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown1"
			aria-controls="navbarNavDropdown1" aria-expanded="false" aria-label="Toggle navigation">
			<span style="font-family: Karla, sans-serif; font-weight: lighter;">Menu</span>
		</button>
		<div class="collapse navbar-collapse" id="navbarNavDropdown1">
			<ul class="navbar-nav text-center">
				<div class="row">
					{% for page in site.pages %} {% if page.title %}
					<div class="col-md-2">
						<li class="nav-item">
							<a class="nav-link" href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
						</li>
					</div>
					{% endif %} {% endfor %}
					<div class="col-md-2">
						<li class="nav-item">
							<a class="nav-link" href="{{ " /blog" | prepend: site.baseurl }}">Blog</a>
						</li>
					</div>
				</div>
			</ul>
		</div>
	</div>
</nav>

<!-- Navigation Bar Ends-->
