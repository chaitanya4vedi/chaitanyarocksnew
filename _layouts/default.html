<!DOCTYPE html>
<html lang="en">
{% include head.html %}

<body>
<div id="fb-root"></div>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_GB/sdk.js#xfbml=1&version=v16.0&appId=1205196510369252&autoLogAppEvents=1" nonce="KHOPj53f"></script>
	{% include header.html %}
	<main>
		<article>
			{{ content }}
		</article>
		{% include footer.html %}
	</main>
{% if jekyll.environment != "development" %}
<script>
	if ("serviceWorker" in navigator) {
		navigator.serviceWorker
				.register("/service-worker.js")
				.then(function(registration) {
					console.log("Success: " + registration.scope);
				})
				.catch(function(err) {
					console.log("Error: " + err);
				});
	}
</script>
{% endif %}
</body>

</html>
